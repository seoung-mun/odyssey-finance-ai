resume_rules:
  - worktree를 만들지 않음
  - 기능 브랜치는 한 번에 하나만 사용
  - 현재 브랜치는 기능 완료와 승인된 merge 전까지 유지
  - push·PR·merge는 사용자 승인 전 금지
  - 모든 사용자 통신과 에이전트 작업 패킷은 YAML만 사용
  - docs/가이드.md와 note.md를 stage·commit·stash하지 않음
  - 새 세션에서 실제 permission profile이 full인지 먼저 확인
  - Docker 검증이 끝날 때마다 Compose는 down
  - 단독 --rm 컨테이너는 종료 후 자동 제거 확인
