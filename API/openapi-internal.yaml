openapi: 3.1.0

info:
  title: Odyssey Compute Service (Internal)
  version: 1.3.0
  description: |
    FastAPI 계산 서비스. **Spring만 호출한다.** 외부에 노출하지 않는다.

    ## 이 서비스가 하는 것

    - 몬테카를로 시뮬레이션 (IID bootstrap, 10,000 경로)
    - 분위수 기반 강도별 절감률 산출 (폐형식)
    - fan chart용 월별 분위수 집계
    - CUSTOM baseline의 시뮬레이션 충족률 재계산
    - Qwen 설명 생성과 원본 숫자 검증, 실패 시 숫자 없는 fallback

    ## 이 서비스가 하지 않는 것

    **DB에 쓰지 않는다.** 계산 결과를 JSON으로 반환만 하고, `plan_versions` ·
    `simulation_runs` · `plan_options` · `plan_option_percentile_bands` 저장은
    전부 Spring이 한 트랜잭션에서 처리한다.

    트랜잭션이 프로세스를 넘지 못하기 때문이다. 양쪽이 나눠 쓰면 한쪽 실패 시
    고아 데이터가 남는다.

    ## 값 규약 (외부 API와 동일)

    - 금액: 원 단위 정수. `float` 금지. numpy 결과는 `int()`로 캐스팅해서 반환할 것
    - 비율: 0~1 소수
    - 시각: ISO 8601 + offset

    ## 인증

    모든 요청은 `X-Internal-Token` 헤더가 필요하다. Spring과 FastAPI는 같은
    시크릿을 공유하며, 배포 환경에서는 AWS Secrets Manager에서 주입한다.

    ## 재현성

    `randomSeed`는 요청에 포함되며, FastAPI는 `np.random.default_rng(seed)`로
    요청마다 독립 Generator를 만들어야 한다. 전역 `np.random`을 쓰면 동시 요청 시
    상태가 섞여 재현이 불가능해진다.

    `inputHash`는 요청 기본값까지 적용된 응답의 `inputSnapshot`을
    `json.dumps(inputSnapshot, sort_keys=True, separators=(',',':'))`로 직렬화한 값의
    SHA-256이다. Python 기본값인 `ensure_ascii=True`를 사용한다.
    `sort_keys` 없이 만들면 같은 입력인데 해시가 달라진다.
    DB에 `CHECK (input_hash ~ '^[0-9a-f]{64}$')`가 걸려 있다.

servers:
  - url: http://analysis-api:8000

tags:
  - name: simulation
    description: 몬테카를로 및 옵션 산출
  - name: explanation
    description: LLM 설명 생성
  - name: ops
    description: 헬스체크

security:
  - internalApiKey: []

paths:

  /internal/simulate:
    post:
      operationId: simulatePlan
      tags: [simulation]
      summary: MC 실행 및 PRESET 옵션 산출
      description: |
        Spring이 feasibility 사전검사(A >= 0)를 통과시킨 뒤에만 호출한다.
        A < 0인 경우는 Spring이 MC 없이 INFEASIBLE로 처리하므로 여기 오지 않는다.

        처리 순서:
        1. `historicalMonthlyVariableSpending`에서 IID 복원추출로 10,000 × `horizonMonths` 배열 생성
        2. 각 열에 `periodRatios`를 적용해 첫 달·마지막 달의 실제 활성 일수를 반영
        3. 예정지출은 부트스트랩 표본 및 총 유동지출 T에서 제외한다. 확정된 절감률 적용 후, fan chart용 월별 누적저축 경로에서 해당 월에 고정값으로 차감한다.
        4. 경로별 총 유동지출 T의 분포에서 Q70 · Q80 · Q90 산출
        5. 추천 월지출을 원 단위로 확정하고 그 금액에서 실제 절감률과 충족률을 계산
        6. 각 옵션의 실제 절감률을 경로에 적용해 누적저축 궤적의 월별 분위수 집계

        **레이턴시 목표: 500ms 이내.** 이 엔드포인트는 Spring의 동기 구간에 있다.

        FastAPI 구현 주의: 이 핸들러는 `async def`가 아니라 `def`로 선언할 것.
        CPU 바운드 연산을 `async def`에 넣으면 이벤트 루프가 막혀 동시 요청이
        전부 직렬화된다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SimulateRequest' }
      responses:
        '200':
          description: 계산 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulateResponse' }
        '422':
          description: 입력이 계산 불가 (표본 부족 등)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComputeError' }
        '500':
          description: 예상하지 못한 서버 오류. X-Request-ID로 로그를 추적한다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComputeError' }

  /internal/custom-option:
    post:
      operationId: computeCustomOption
      tags: [simulation]
      summary: CUSTOM baseline의 충족률 재계산
      description: |
        사용자가 "현실적으로 유지 가능한 월 유동지출"을 직접 정했을 때,
        **동일한 시나리오 집합**에서 그 baseline의 시뮬레이션 충족률을 계산한다.

        재시뮬레이션이 아니다. `randomSeed`와 입력이 같으면 `/internal/simulate`와
        동일한 경로 집합이 재생성되므로, 같은 경로에 다른 절감률을 적용하는
        산술 변환만 수행한다. common random numbers가 유지된다.

        모델 가정: baseline을 낮춘 뒤에도 과거의 상대적 소비 변동 형태
        (정규화된 변동계수)는 유지된다고 본다. 실사용자 데이터로 추후 검증 필요.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SimulateRequest'
                - type: object
                  required: [baselineMonthlySpending]
                  properties:
                    baselineMonthlySpending:
                      type: integer
                      format: int64
                      minimum: 0
                      maximum: 9223372036854775807
                      description: 사용자가 정한 월 유동지출 (원)
      responses:
        '200':
          description: 계산 완료
          content:
            application/json:
              schema:
                type: object
                required: [option, percentileBands]
                properties:
                  option: { $ref: '#/components/schemas/ComputedOption' }
                  percentileBands:
                    type: array
                    items: { $ref: '#/components/schemas/PercentileBand' }
        '422':
          description: 계산 불가
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComputeError' }
        '500':
          description: 예상하지 못한 서버 오류. X-Request-ID로 로그를 추적한다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComputeError' }

  /internal/policy-scenarios:
    post:
      operationId: computePolicyScenario
      tags: [simulation]
      summary: 선택된 현재 계획과 정책 adjustment 가정 비교
      description: |
        `planInput`의 sampled paths를 한 번만 생성해 current와 assumed가 공유한다.
        PRESET은 선택 nominal level 하나만, CUSTOM은 기존 baseline을 고정한 채 비교한다.
        월 지원은 지정된 각 달에 전액 적용하고 일할 계산하지 않는다. 일회성 지원은
        목표 잔액 감소 가정이므로 CUMULATIVE_SAVINGS bands에는 더하지 않는다.

        이 계약은 사용자 ID, 정책 ID, `supportGoal`, 검색 답변, 공식 URL·원문을 받지 않는다.
        알 수 없는 필드는 422로 거부한다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyScenarioRequest' }
      responses:
        '200':
          description: 저장하지 않는 current/assumed 비교 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyScenarioResponse' }
        '422':
          description: adjustment·기간·산술 범위 오류
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComputeError' }
        '500':
          description: 예상하지 못한 서버 오류. X-Request-ID로 로그를 추적한다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComputeError' }

  /internal/explanations:
    post:
      operationId: generateExplanation
      tags: [explanation]
      summary: 확정 계획 설명 생성
      description: |
        확정 계획 JSON의 계산 결과를 결정론적인 한국어 고정 템플릿으로 설명한다.
        외부 모델이나 네트워크를 호출하지 않으며 정상 요청에는 `200 READY`를 반환한다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExplanationRequest' }
      responses:
        '200':
          description: 생성 완료 (fallback 포함)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExplanationResponse' }

  /internal/health:
    get:
      operationId: getInternalHealth
      tags: [ops]
      summary: 헬스체크
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  engineVersion: { type: string }
                  llmModel: { type: string }
                  llmReady:
                    type: boolean
                    description: false면 설명 생성이 즉시 fallback으로 떨어진다

components:
  securitySchemes:
    internalApiKey:
      type: apiKey
      in: header
      name: X-Internal-Token

  schemas:

    ConfirmedOneTimeFundingAdjustment:
      type: object
      additionalProperties: false
      required:
        [source, policyBenefitId, policyVersionId, adjustmentType, amountWon, startYearMonth]
      properties:
        source: { type: string, const: POLICY_BENEFIT }
        policyBenefitId: { type: integer, format: int64, minimum: 1 }
        policyVersionId: { type: integer, format: int64, minimum: 1 }
        adjustmentType: { type: string, const: ONE_TIME_FUNDING }
        amountWon: { type: integer, format: int64, minimum: 1, maximum: 1000000000000000 }
        startYearMonth: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }

    ConfirmedMonthlyExpenseReductionAdjustment:
      type: object
      additionalProperties: false
      required:
        [source, policyBenefitId, policyVersionId, adjustmentType, amountWon, startYearMonth, endYearMonth]
      properties:
        source: { type: string, const: POLICY_BENEFIT }
        policyBenefitId: { type: integer, format: int64, minimum: 1 }
        policyVersionId: { type: integer, format: int64, minimum: 1 }
        adjustmentType: { type: string, const: MONTHLY_EXPENSE_REDUCTION }
        amountWon: { type: integer, format: int64, minimum: 1, maximum: 1000000000000000 }
        startYearMonth: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        endYearMonth: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }

    ConfirmedFutureCashflowAdjustment:
      oneOf:
        - $ref: '#/components/schemas/ConfirmedOneTimeFundingAdjustment'
        - $ref: '#/components/schemas/ConfirmedMonthlyExpenseReductionAdjustment'
      discriminator:
        propertyName: adjustmentType

    SimulateRequest:
      type: object
      additionalProperties: false
      required:
        - randomSeed
        - horizonMonths
        - periodRatios
        - availableVariableBudget
        - historicalMonthlyVariableSpending
        - currentAvgVariableSpending
      properties:
        randomSeed:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
          description: Spring이 발급. 응답의 시뮬레이션 재현에 사용
        nPaths:
          type: integer
          default: 10000
          enum: [10000]
        horizonMonths:
          type: integer
          minimum: 1
          maximum: 120
          description: KST 기준 현재 월과 목표 월을 포함한 달력 월 개수
        periodRatios:
          type: array
          minItems: 1
          maxItems: 120
          items:
            type: number
            exclusiveMinimum: 0
            maximum: 1
          description: |
            길이는 horizonMonths와 같다. 첫 달은 `(월말-기준일+1)/월일수`,
            마지막 달은 `목표일/월일수`, 같은 달이면
            `(목표일-기준일+1)/월일수`다. 중간 달은 반드시 1.0이다.
        availableVariableBudget:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
          description: |
            A = (월소득 - 월고정비) × 남은개월 - 예정지출 - 남은목표액.
            Spring이 이번 달 기지출까지 한 번만 반영해 넘긴다. FastAPI는 다시 차감하지 않는다
        historicalMonthlyVariableSpending:
          type: array
          description: |
            과거 월별 유동지출. **과거→최근 순서.**
            `monthly_spending_summary.bootstrap_eligible_spending` 값이며
            예정지출 매칭분은 이미 제외돼 있다
          items:
            type: integer
            format: int64
            minimum: 0
            maximum: 9223372036854775807
          minItems: 3
        currentAvgVariableSpending:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
          description: 감축률 계산의 기준이 되는 현재 월평균
        remainingScheduledExpenses:
          type: array
          description: 목표 기간 안에 남은 예정지출. 해당 달 경로에 고정 차감
          items:
            type: object
            required: [monthIndex, amount]
            properties:
              monthIndex:
                type: integer
                minimum: 1
                description: 계획 시작 후 N개월차
              amount:
                type: integer
                format: int64
                minimum: 0
                maximum: 9223372036854775807
        simulationStartYearMonth:
          type: [string, 'null']
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          default: null
          description: |
            futureCashflowAdjustments가 비어 있지 않을 때 필수. horizon의 1개월차 달력 월이며
            Spring이 기존 targetDate와 horizonMonths에서 재구성한다.
        futureCashflowAdjustments:
          type: array
          default: []
          description: |
            현재 goal에서 확인된 정책 혜택. ONE_TIME은 start 월 한 번,
            MONTHLY는 start~end inclusive 교집합 월에 positive cashflow로 반영한다.
          items: { $ref: '#/components/schemas/ConfirmedFutureCashflowAdjustment' }
        presetLevels:
          type: array
          minItems: 1
          default: [0.70, 0.80, 0.90]
          items:
            type: number
            exclusiveMinimum: 0
            exclusiveMaximum: 1
        policySnapshot:
          type: object
          additionalProperties: true
          properties:
            aggressiveWarningPct:
              type: number
              minimum: 0
              maximum: 1
          description: |
            당시 정책 파라미터. FastAPI는 `aggressiveWarningPct`만 사용하고
            나머지는 그대로 응답에 되돌려준다 (Spring이 저장)

    SimulateResponse:
      type: object
      required: [simulation, options, percentileBands]
      properties:
        simulation: { $ref: '#/components/schemas/SimulationMeta' }
        options:
          type: array
          description: PRESET 옵션들. 요청의 presetLevels 순서와 동일
          items: { $ref: '#/components/schemas/ComputedOption' }
        percentileBands:
          type: array
          description: |
            모든 옵션의 밴드를 평평하게 담는다. `optionIndex`로 어느 옵션의
            것인지 구분한다. `monthIndex`는 1부터 horizonMonths까지 **빠짐없이**
            채워야 한다. DB는 구멍을 검출하지 못한다
          items: { $ref: '#/components/schemas/PercentileBand' }

    PolicyScenarioRequest:
      type: object
      additionalProperties: false
      required: [planInput, selectedOption, adjustment]
      properties:
        planInput: { $ref: '#/components/schemas/ScenarioPlanInput' }
        selectedOption: { $ref: '#/components/schemas/ScenarioSelectedOption' }
        adjustment: { $ref: '#/components/schemas/FutureCashflowAdjustment' }

    ScenarioPlanInput:
      allOf:
        - $ref: '#/components/schemas/SimulateRequest'
        - type: object
          properties:
            remainingScheduledExpenses:
              type: array
              items: { $ref: '#/components/schemas/ScenarioScheduledExpense' }
            policySnapshot: { $ref: '#/components/schemas/ScenarioPolicySnapshot' }

    ScenarioScheduledExpense:
      type: object
      additionalProperties: false
      required: [monthIndex, amount]
      properties:
        monthIndex:
          type: integer
          minimum: 1
        amount:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807

    ScenarioPolicySnapshot:
      type: object
      additionalProperties: false
      properties:
        aggressiveWarningPct:
          type: number
          minimum: 0
          maximum: 1

    ScenarioSelectedOption:
      oneOf:
        - $ref: '#/components/schemas/SelectedPresetOption'
        - $ref: '#/components/schemas/SelectedCustomOption'
      discriminator:
        propertyName: optionType

    SelectedPresetOption:
      type: object
      additionalProperties: false
      required: [optionType, nominalLevel]
      properties:
        optionType: { type: string, const: PRESET }
        nominalLevel:
          type: number
          exclusiveMinimum: 0
          exclusiveMaximum: 1

    SelectedCustomOption:
      type: object
      additionalProperties: false
      required: [optionType, baselineMonthlySpending]
      properties:
        optionType: { type: string, const: CUSTOM }
        baselineMonthlySpending:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807

    FutureCashflowAdjustment:
      oneOf:
        - $ref: '#/components/schemas/OneTimeFundingAdjustment'
        - $ref: '#/components/schemas/MonthlyExpenseReductionAdjustment'
      discriminator:
        propertyName: type

    OneTimeFundingAdjustment:
      type: object
      additionalProperties: false
      required: [type, amountWon, startMonthIndex, sourceVersion]
      properties:
        type: { type: string, const: ONE_TIME_FUNDING }
        amountWon:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000000000
        startMonthIndex: { type: integer, minimum: 1, maximum: 120 }
        sourceVersion: { type: string, minLength: 1, maxLength: 100 }

    MonthlyExpenseReductionAdjustment:
      type: object
      additionalProperties: false
      required: [type, amountWon, startMonthIndex, endMonthIndex, sourceVersion]
      properties:
        type: { type: string, const: MONTHLY_EXPENSE_REDUCTION }
        amountWon:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000000000
        startMonthIndex: { type: integer, minimum: 1, maximum: 120 }
        endMonthIndex: { type: integer, minimum: 1, maximum: 120 }
        sourceVersion: { type: string, minLength: 1, maxLength: 100 }

    PolicyScenarioResponse:
      type: object
      additionalProperties: false
      required: [currentPlanSummary, assumedPlanSummary, currentBands, assumedBands]
      properties:
        currentPlanSummary: { $ref: '#/components/schemas/ComputedOption' }
        assumedPlanSummary: { $ref: '#/components/schemas/ComputedOption' }
        currentBands:
          type: array
          items: { $ref: '#/components/schemas/PercentileBand' }
        assumedBands:
          type: array
          description: |
            MONTHLY_EXPENSE_REDUCTION은 적용 월부터 현금흐름 차이를 반영한다.
            ONE_TIME_FUNDING은 목표 잔액 감소 가정이므로 currentBands와 동일하다.
          items: { $ref: '#/components/schemas/PercentileBand' }

    SimulationMeta:
      type: object
      required: [method, nPaths, randomSeed, inputHash, engineVersion, inputSnapshot, resultSummary]
      properties:
        method:
          type: string
          enum: [IID_BOOTSTRAP]
        nPaths: { type: integer }
        randomSeed: { type: integer, format: int64 }
        inputHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: 기본값 적용 후 inputSnapshot을 정규화 직렬화한 SHA-256 hex
        engineVersion: { type: string }
        inputSnapshot:
          type: object
          additionalProperties: true
          description: |
            MC에 실제로 전달한 계산 입력 전체. 빈 객체 금지 (DB CHECK).
            과거 거래가 나중에 수정돼도 당시 입력을 그대로 보존하기 위함
        resultSummary:
          type: object
          additionalProperties: true
          description: |
            raw 10,000 경로 대신 핵심 통계만. 빈 객체 금지.
            예: totalSpendingQ70/Q80/Q90, medianFinalSavings

    ComputedOption:
      type: object
      required:
        - optionType
        - recommendedMonthlySpending
        - requiredReductionRate
        - simulationCoverage
        - historicalFeasibilityRatio
        - aggressiveWarning
        - targetCoverageMet
      properties:
        optionType: { type: string, enum: [PRESET, CUSTOM] }
        nominalLevel:
          type: [number, 'null']
          description: |
            PRESET은 0.70 등. CUSTOM은 반드시 null.
            DB에 `ck_plan_option_nominal_level_by_type`이 걸려 있어
            CUSTOM에 값을 넣으면 Spring의 INSERT가 실패한다.
            소수 3자리로 반올림해서 보낼 것 (NUMERIC(4,3))
        recommendedMonthlySpending: { type: integer, format: int64, minimum: 0 }
        requiredReductionRate:
          type: number
          minimum: -9223372036854775806
          maximum: 1
          description: 소수 4자리로 반올림 (NUMERIC(23,4)). 소득 증가 시 음수 가능
        simulationCoverage:
          type: number
          minimum: 0
          maximum: 1
          description: 소수 4자리로 반올림 (NUMERIC(5,4))
        historicalFeasibilityRatio:
          type: number
          minimum: 0
          maximum: 1
          description: 최근 24개월 중 이 수준 이하로 소비한 달의 비율
        aggressiveWarning:
          type: boolean
          description: historicalFeasibilityRatio가 정책 임계치 이하면 true
        targetCoverageMet:
          type: boolean
          description: 확정 추천액의 실제 coverage가 PRESET nominalLevel 이상인지 여부

    PercentileBand:
      type: object
      required: [optionIndex, monthIndex, metricType, p10, p25, p50, p75, p90]
      properties:
        optionIndex:
          type: integer
          description: options 배열의 인덱스
        monthIndex: { type: integer, minimum: 1 }
        metricType:
          type: string
          default: CUMULATIVE_SAVINGS
        p10: { type: integer, format: int64 }
        p25: { type: integer, format: int64 }
        p50: { type: integer, format: int64 }
        p75: { type: integer, format: int64 }
        p90: { type: integer, format: int64 }
      description: |
        p10 <= p25 <= p50 <= p75 <= p90 단조성이 DB CHECK로 강제된다.
        `np.percentile(x, [10,25,50,75,90], axis=0)`으로 한 번에 계산할 것.
        따로 계산하고 반올림 방식이 다르면 단조성이 깨질 수 있다

    ExplanationRequest:
      type: object
      required: [planVersionId, allowedNumbers, plan]
      properties:
        planVersionId:
          type: integer
          description: 로그 상관관계용. FastAPI가 DB를 조회하지는 않는다
        maxRetry:
          type: integer
          default: 2
          minimum: 0
          maximum: 2
          description: 교정 횟수. 최초 생성을 포함한 총 모델 호출은 `maxRetry + 1`, 최대 3회다
        allowedNumbers:
          type: array
          description: |
            문장에 등장해도 되는 숫자 전체. 가드레일이 이 집합과 대조한다.
            여기 없는 숫자가 나오면 재생성
          items: { type: integer, format: int64 }
        plan:
          type: object
          required: [recommendedMonthlySpending, currentAvgVariableSpending, remainingMonths]
          properties:
            recommendedMonthlySpending: { type: integer, format: int64 }
            currentAvgVariableSpending: { type: integer, format: int64 }
            remainingMonths: { type: integer }
            targetAmount: { type: integer, format: int64 }
            currentSavedAmount: { type: integer, format: int64 }
            simulationCoverage: { type: number }
            aggressiveWarning: { type: boolean }
        previousPlan:
          type: [object, 'null']
          description: |
            재계획일 때만. **diff만 보낸다.** 이력 전체를 보내면 안 된다
          properties:
            versionNo: { type: integer }
            recommendedMonthlySpending: { type: integer, format: int64 }
            deltaMonthlySpending:
              type: integer
              format: int64
              description: 새 계획 - 이전 계획. 음수면 더 줄여야 함
            triggerType: { type: string }
            triggerDetails:
              type: object
              additionalProperties: true

    ExplanationResponse:
      type: object
      required: [status, text]
      properties:
        status:
          type: string
          enum: [READY, FALLBACK]
          description: |
            READY = 확정 계획의 결정론적 템플릿 설명 생성 완료.
            FALLBACK = 기존 소비자와의 계약 호환을 위해 유지되는 숫자 없는 대체 상태
        text:
          type: string
          description: 화면에 그대로 표시되는 한국어 계획 설명
        model:
          type: [string, 'null']
          description: 설명 생성 방식 식별자. FALLBACK이면 null일 수 있다
        retryCount: { type: integer }
        failedNumbers:
          type: array
          description: 재시도를 유발한 숫자들 (운영 관찰용)
          items: { type: string }
        generatedAt: { type: string, format: date-time }

    ComputeError:
      type: object
      properties:
        code:
          type: string
          description: |
            INSUFFICIENT_HISTORY · INVALID_HORIZON · INVALID_INPUT · LLM_UNAVAILABLE ·
            SERIALIZATION_ERROR
        message: { type: string }
        detail:
          type: [object, 'null']
          additionalProperties: true
