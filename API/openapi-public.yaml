openapi: 3.0.3

info:
  title: Odyssey Finance API
  version: 1.1.0
  description: |
    오디세이 금융계획 웹 서비스의 외부 API (Spring). React 웹이 호출한다.

    ## 확정된 규약

    - **금액**: 원 단위 정수. 소수점 없음.
    - **비율**: 0~1 사이 소수. `0.15`가 15%다. 퍼센트 정수(`15`)를 보내면 안 된다.
    - **시각**: ISO 8601 + offset 필수. `2026-08-01T00:00:00+09:00` (O) / `2026-08-01` (X)
    - **날짜**: `date` 타입만 offset 없는 `YYYY-MM-DD` 사용 (생년월일, 목표일 등)
    - **월 표기**: `yearMonth`는 그 달 1일의 date. `2026-08-01` = 2026년 8월
    - **계획 생성**: 숫자·fan chart는 동기, LLM 설명만 Redis queue 후 별도 폴링

    ## 하이브리드 응답 방식

    `POST /goals/{goalId}/plan-versions`는 MC 시뮬레이션과 옵션 산출까지만 동기로
    처리하고 즉시 200을 반환한다. 정상 enqueue면 `explanation.status = PENDING`이고
    `explanation.text`는 null이다. Redis 발행이 실패하면 계획은 그대로 반환하고 설명만
    같은 응답에서 `FALLBACK`일 수 있다.

    LLM 설명은 백그라운드에서 생성되며, 클라이언트는
    `GET /plan-versions/{planVersionId}/explanation`을 2초 간격으로 폴링해
    `READY` 또는 `FALLBACK`이 될 때까지 기다린다. 설명이 실패해도 계획 자체는
    이미 사용 가능하다.

    ## 에러

    RFC 7807 `application/problem+json`. `code` 필드로 분기한다.
    409는 대부분 동시 요청 경합이므로, 클라이언트는 해당 리소스를 재조회하면 된다.

servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: localhost:8080

tags:
  - name: auth
    description: Google OIDC 로그인 및 토큰
  - name: onboarding
    description: 프로필 · 금융정보 입력
  - name: demo
    description: 데모 테스터 조회와 데이터 seed
  - name: goals
    description: 목표
  - name: scheduled-expenses
    description: 예정지출
  - name: transactions
    description: 거래 및 월별 집계
  - name: plans
    description: 계획 버전 · 선택지 (핵심)
  - name: replan
    description: 재계획 이벤트
  - name: dashboard
    description: 화면 진입용 통합 조회

security:
  - bearerAuth: []

paths:

  # ─────────────────────────────────────────── auth
  /auth/google:
    post:
      operationId: exchangeGoogleToken
      tags: [auth]
      summary: Google id_token 교환
      description: |
        React가 Google 로그인으로 받은 `id_token`을 보내면, Spring이 OIDC 검증 후
        `social_accounts(provider, provider_subject)`로 내부 사용자를 찾거나 생성하고
        자체 JWT를 발급한다.

        신규 가입이면 `isNewUser=true`이고 온보딩 화면으로 보내야 한다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken:
                  type: string
                  description: Google이 발급한 OIDC ID 토큰
      responses:
        '200':
          description: 로그인 성공
          headers:
            Set-Cookie:
              schema: { type: string }
              description: 7일 refresh JWT cookie; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401':
          $ref: '#/components/responses/Problem401'

  /auth/refresh:
    post:
      operationId: refreshAccessToken
      tags: [auth]
      summary: access token 갱신
      security: []
      description: |
        `refresh_token` HttpOnly cookie를 검증하고 회전한다. 성공 응답은 새 access token만
        본문에 담고 새 refresh token은 `Secure; HttpOnly; SameSite=Strict; Path=/api/v1/auth`
        cookie로 설정한다.
      responses:
        '200':
          description: 갱신됨
          headers:
            Set-Cookie:
              schema: { type: string }
              description: 회전된 refresh JWT cookie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401':
          $ref: '#/components/responses/Problem401'

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: refresh session 폐기
      security: []
      description: |
        서버의 refresh session을 폐기하고 로그인·회전 때와 동일한
        `Path=/api/v1/auth`로 만료 cookie를 내려 브라우저 값을 삭제한다.
      responses:
        '204':
          description: 로그아웃됨
          headers:
            Set-Cookie:
              schema: { type: string }
              description: 만료된 refresh JWT cookie; Path=/api/v1/auth

  /demo/testers:
    get:
      operationId: listDemoTesters
      tags: [demo]
      summary: 선택 가능한 데모 테스터 조회
      responses:
        '200':
          description: 시나리오 버전별 테스터 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DemoTester' }

  /me/demo-seed:
    post:
      operationId: seedDemoUser
      tags: [demo]
      summary: 선택한 테스터의 데모 데이터를 현재 사용자에게 적재
      description: |
        PostgreSQL의 오프라인 거래 템플릿을 KST 기준일에 맞춰 재생한다. 같은 테스터·버전·
        KST 날짜의 재실행 결과는 같고, 이 호출은 계획 결과를 생성하지 않는다.
        데모 상태가 없는 기존 데이터 사용자는 409로 거부한다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DemoSeedRequest' }
      responses:
        '200':
          description: 데모 데이터 적재 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoSeedResponse' }
        '409': { $ref: '#/components/responses/Problem409' }

  /me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: 현재 사용자 및 온보딩 상태
      description: |
        `onboardingComplete`가 false면 어떤 단계가 비었는지 `missingSteps`로 알려준다.
        계획 생성에는 profile과 financialProfile이 모두 필요하다.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }

  # ─────────────────────────────────────────── onboarding
  /me/profile:
    get:
      operationId: getUserProfile
      tags: [onboarding]
      summary: 인적 프로필 조회
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '404':
          $ref: '#/components/responses/Problem404'
    put:
      operationId: upsertUserProfile
      tags: [onboarding]
      summary: 인적 프로필 저장 (upsert)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserProfileInput' }
      responses:
        '200':
          description: 저장됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '400':
          $ref: '#/components/responses/Problem400'

  /me/financial-profile:
    get:
      operationId: getFinancialProfile
      tags: [onboarding]
      summary: 현재 월소득 · 월고정비 조회
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinancialProfile' }
        '404':
          $ref: '#/components/responses/Problem404'
    put:
      operationId: upsertFinancialProfile
      tags: [onboarding]
      summary: 월소득 · 월고정비 저장 (upsert)
      description: |
        값이 실제로 바뀌면 ACTIVE 목표에 대해 재계획 트리거
        (`INCOME_CHANGED` / `FIXED_COST_CHANGED`)가 발생한다.
        응답의 `triggeredReplanEventId`로 확인할 수 있다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinancialProfileInput' }
      responses:
        '200':
          description: 저장됨
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FinancialProfile'
                  - type: object
                    properties:
                      triggeredReplanEventId:
                        type: integer
                        nullable: true
                        description: 재계획이 트리거됐으면 이벤트 ID
                      replanOutcome:
                        type: string
                        enum: [NOT_REQUIRED, PROPOSED, INFEASIBLE]
                      planVersionId: { type: integer, nullable: true }
                      shortfallAmount: { type: integer, format: int64, nullable: true }
        '400':
          $ref: '#/components/responses/Problem400'
        '409': { $ref: '#/components/responses/Problem409' }
        '503':
          description: 계산 서비스 일시 장애. 변경은 저장되지 않음
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ─────────────────────────────────────────── goals
  /goals:
    get:
      operationId: listGoals
      tags: [goals]
      summary: 목표 목록
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, ACHIEVED, CANCELLED]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Goal' }
    post:
      operationId: createGoal
      tags: [goals]
      summary: 목표 생성
      description: |
        MVP는 사용자당 ACTIVE 목표를 하나로 제한한다
        (`uq_goal_active_per_user`). 이미 ACTIVE 목표가 있으면 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoalInput' }
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Goal' }
        '400':
          $ref: '#/components/responses/Problem400'
        '422':
          description: CUSTOM 금액이 확정 소비 하한보다 작음
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: 이미 ACTIVE 목표가 존재 (code=ACTIVE_GOAL_EXISTS)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /goals/{goalId}:
    parameters:
      - $ref: '#/components/parameters/GoalId'
    get:
      operationId: getGoal
      tags: [goals]
      summary: 목표 단건
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Goal' }
        '404':
          $ref: '#/components/responses/Problem404'
    patch:
      operationId: updateGoal
      tags: [goals]
      summary: 목표 수정
      description: |
        `targetAmount` 또는 `targetDate`가 바뀌면 즉시 재계획 트리거
        (`GOAL_AMOUNT_CHANGED` / `GOAL_DATE_CHANGED`)가 발생한다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoalPatch' }
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Goal'
                  - type: object
                    properties:
                      triggeredReplanEventId:
                        type: integer
                        nullable: true
        '400':
          $ref: '#/components/responses/Problem400'
        '404':
          $ref: '#/components/responses/Problem404'

  # ─────────────────────────────────────────── scheduled expenses
  /scheduled-expenses:
    get:
      operationId: listScheduledExpenses
      tags: [scheduled-expenses]
      summary: 예정지출 목록
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PLANNED, COMPLETED, CANCELLED]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ScheduledExpense' }
    post:
      operationId: createScheduledExpense
      tags: [scheduled-expenses]
      summary: 예정지출 등록
      description: 등록 즉시 `SCHEDULED_EXPENSE_CHANGED` 재계획 트리거가 발생한다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduledExpenseInput' }
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ScheduledExpense'
                  - type: object
                    properties:
                      triggeredReplanEventId: { type: integer, nullable: true }
        '400':
          $ref: '#/components/responses/Problem400'

  /scheduled-expenses/{scheduledExpenseId}:
    parameters:
      - name: scheduledExpenseId
        in: path
        required: true
        schema: { type: integer }
    patch:
      operationId: updateScheduledExpense
      tags: [scheduled-expenses]
      summary: 예정지출 수정 · 취소
      description: |
        `status=CANCELLED`로 바꾸면, 여기에 매칭돼 있던 거래는 일반 유동지출로
        되돌아가 부트스트랩 표본에 다시 포함된다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduledExpensePatch' }
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ScheduledExpense'
                  - type: object
                    properties:
                      triggeredReplanEventId: { type: integer, nullable: true }
        '404':
          $ref: '#/components/responses/Problem404'

  # ─────────────────────────────────────────── transactions
  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: 거래 목록 (커서 페이지네이션)
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
          description: 이 시각 이상 (offset 필수)
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: category
          in: query
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string }
          description: 이전 응답의 nextCursor
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionPage' }

  /transactions/import:
    post:
      operationId: importTransactions
      tags: [transactions]
      summary: 거래 일괄 적재 (멱등)
      description: |
        `sourceId`와 `externalTransactionId`의 조합은 필수다. 같은 조합이 이미 있으면 조용히 건너뛰고
        `skipped`에 집계한다. 이 필드가 없으면 중복 적재를 막을 방법이 없고,
        중복분이 그대로 부트스트랩 입력에 들어가 추천 소비액이 왜곡된다.
        REFUND의 `refundAllocations`는 같은 요청 안의 PAYMENT나 이미 저장된 PAYMENT를
        정확한 외부 식별자로만 연결한다. 아직 PAYMENT가 없으면 pending으로 보존한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transactions]
              properties:
                transactions:
                  type: array
                  maxItems: 1000
                  items: { $ref: '#/components/schemas/TransactionInput' }
      responses:
        '200':
          description: 처리 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  inserted: { type: integer }
                  skipped:
                    type: integer
                    description: sourceId + externalTransactionId 중복으로 건너뛴 건수
                  allocationsInserted:
                    type: integer
                    description: 저장된 환불 배분 건수
                  allocationsPending:
                    type: integer
                    description: 아직 PAYMENT가 없어 미해결인 환불 배분 건수
        '400':
          $ref: '#/components/responses/Problem400'

  /transactions/monthly-summary:
    get:
      operationId: getMonthlySpendingSummary
      tags: [transactions]
      summary: 월별 소비 집계
      description: |
        월 경계는 Asia/Seoul 기준이다.
        연결 환불은 원 PAYMENT 월 소비를 조정한다. 미연결·pending 환불은 REFUND가
        발생한 월의 현금 유입에만 표시하며 예측 표본에 넣지 않는다.
        `bootstrapEligibleSpending`은 유효한 예정지출을 제외한 비음수 조정 소비로,
        MC 부트스트랩 입력과 동일하다.
      parameters:
        - name: months
          in: query
          schema: { type: integer, default: 24, maximum: 60 }
          description: 최근 N개월
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MonthlySpending' }

  /transactions/category-summary:
    get:
      operationId: getCategorySpendingSummary
      tags: [transactions]
      summary: 카테고리별 월평균
      description: |
        기획서 5-4의 "소비내역으로 확인" 화면용. 최근 N개월 카테고리별 평균을
        돌려준다. 이 화면에서 사용자는 카테고리별로 나눠 입력하지 않고
        "현실적으로 유지 가능한 월 유동지출" 하나만 정한다.
      parameters:
        - name: months
          in: query
          schema: { type: integer, default: 3, maximum: 24 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  months: { type: integer }
                  currentAvgVariableSpending:
                    type: integer
                    format: int64
                    description: 전체 월평균 유동지출
                  categories:
                    type: array
                    items:
                      type: object
                      properties:
                        category: { type: string }
                        monthlyAverage: { type: integer, format: int64 }

  # ─────────────────────────────────────────── plans
  /goals/{goalId}/plan-versions:
    parameters:
      - $ref: '#/components/parameters/GoalId'
    get:
      operationId: listPlanVersions
      tags: [plans]
      summary: 계획 버전 이력
      description: 재계획 이력 화면용. 최신 버전이 앞에 온다.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PROPOSED, ACTIVE, SUPERSEDED, REJECTED, INFEASIBLE, STALE]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PlanVersionSummary' }
    post:
      operationId: createPlanVersion
      tags: [plans]
      summary: 계획 생성 (하이브리드)
      description: |
        **동기 구간**: feasibility 사전검사 → MC 10,000 경로 → 70/80/90 옵션 산출
        → fan chart 분위수 저장. 수백 ms 안에 200을 반환한다.

        **비동기 구간**: LLM 설명 생성. 정상 enqueue면 응답의 `explanation.status`는
        `PENDING`이고 `explanation.text`는 null이다. Redis 발행 실패면 계산 결과를
        유지한 채 설명만 `FALLBACK`일 수 있다. `GET /plan-versions/{id}/explanation`을
        2초 간격으로 폴링할 것.

        기존에 미결정 `PROPOSED` 버전이 있으면 자동으로 `STALE` 처리되고
        새 버전이 유일한 `PROPOSED`가 된다.

        A(가용예산) < 0이면 MC를 돌리지 않고 `INFEASIBLE` 상태의 버전을 만든 뒤
        422를 반환한다. 목표금액 축소 · 기간 연장 · 소득 반영 중 하나가 필요하다.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                generationType:
                  type: string
                  enum: [INITIAL, USER_REQUESTED]
                  default: INITIAL
      responses:
        '200':
          description: 계획 생성됨 (설명은 PENDING 또는 Redis 장애 시 FALLBACK)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanVersionDetail' }
        '409':
          description: |
            동시 요청 경합. 다른 요청이 이미 최신 제안을 만들었다.
            (code=PROPOSED_PLAN_EXISTS) 해당 goal의 계획을 재조회할 것.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: 수학적으로 목표 달성 불가 (code=PLAN_INFEASIBLE)
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      planVersionId: { type: integer }
                      infeasibleReason: { type: string }
                      shortfallAmount:
                        type: integer
                        format: int64
                        description: 유동지출을 0으로 해도 부족한 금액

  /plan-versions/{planVersionId}:
    parameters:
      - $ref: '#/components/parameters/PlanVersionId'
    get:
      operationId: getPlanVersion
      tags: [plans]
      summary: 계획 버전 상세 (옵션 + fan chart 포함)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanVersionDetail' }
        '404':
          $ref: '#/components/responses/Problem404'

  /plan-versions/{planVersionId}/explanation:
    parameters:
      - $ref: '#/components/parameters/PlanVersionId'
    get:
      operationId: getPlanExplanation
      tags: [plans]
      summary: LLM 설명 폴링
      description: |
        하이브리드 응답의 두 번째 단계. 2초 간격 폴링을 권장하며,
        30초가 지나도 `PENDING`이면 폴링을 멈추고 설명 없이 계획만 보여줄 것.

        - `PENDING` — 생성 중
        - `PROCESSING` — worker가 작업을 가져가 생성 중
        - `READY` — LLM이 생성했고 숫자 검증(가드레일)을 통과
        - `FALLBACK` — timeout, Redis·Ollama 장애, 응답·숫자 검증 실패. 숫자 없는 템플릿으로 대체
        - `FAILED` — 생성 자체가 실패. 설명 영역을 숨길 것
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Explanation' }
        '404':
          $ref: '#/components/responses/Problem404'

  /plan-versions/{planVersionId}/custom-option:
    parameters:
      - $ref: '#/components/parameters/PlanVersionId'
    post:
      operationId: createCustomOption
      tags: [plans]
      summary: CUSTOM 옵션 생성 (사용자 baseline)
      description: |
        기획서 5-4. 제시된 70/80/90 계획이 과거 소비패턴 대비 과도하게 공격적일 때,
        사용자가 "현실적으로 유지 가능한 월 유동지출"을 직접 정하면 동일 시나리오
        집합에서 시뮬레이션 충족률을 재계산한다.

        **인과 순서 주의**: baseline을 먼저 정하고 그 결과로 충족률이 나온다.
        "86% 계획이므로 85만원" 같은 역순 표현을 UI에 쓰면 안 된다.

        한 계획 버전에 CUSTOM 옵션은 여러 개 만들 수 있으나, 실무상 마지막 것만
        보여주면 된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monthlySpending]
              properties:
                monthlySpending:
                  type: integer
                  format: int64
                  description: 사용자가 정한 월 유동지출 baseline (원)
      responses:
        '200':
          description: 생성됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanOption' }
        '400':
          $ref: '#/components/responses/Problem400'
        '422':
          description: CUSTOM 금액이 확정 소비 하한보다 작음
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: 이 버전은 더 이상 선택 가능한 상태가 아님 (code=PLAN_NOT_SELECTABLE)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /plan-versions/{planVersionId}/select-option:
    parameters:
      - $ref: '#/components/parameters/PlanVersionId'
    post:
      operationId: selectPlanOption
      tags: [plans]
      summary: 옵션 선택 및 계획 적용
      description: |
        선택한 옵션에 `selectedAt`을 기록하고 계획 버전을 `ACTIVE`로 전환한다.
        기존 ACTIVE 버전이 있으면 `SUPERSEDED`가 된다. 이 전부가 한 트랜잭션이다.

        이 요청 이후부터 shock · drift 트리거의 기준이 새 계획으로 재설정된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planOptionId]
              properties:
                planOptionId: { type: integer }
      responses:
        '200':
          description: 적용됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanVersionDetail' }
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          description: |
            이미 다른 옵션이 선택됐거나(code=OPTION_ALREADY_SELECTED)
            버전 상태가 선택 불가(code=PLAN_NOT_SELECTABLE).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ─────────────────────────────────────────── replan
  /goals/{goalId}/replan-events:
    parameters:
      - $ref: '#/components/parameters/GoalId'
    get:
      operationId: listReplanEvents
      tags: [replan]
      summary: 재계획 이벤트 타임라인
      description: |
        "왜 계획이 바뀌었는지"를 보여주는 화면용. 정기(`MONTHLY_REGULAR`)와
        비정기 트리거가 시간순으로 섞여 나온다.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReplanEvent' }

  /goals/{goalId}/replan:
    parameters:
      - $ref: '#/components/parameters/GoalId'
    post:
      operationId: requestReplan
      tags: [replan]
      summary: 사용자 요청 재계획
      description: |
        `USER_REQUESTED` 트리거로 재계획 이벤트를 만들고 새 계획 버전을 생성한다.
        응답 구조와 설명 폴링 방식은 `POST /goals/{goalId}/plan-versions`와 같다.
      responses:
        '200':
          description: 새 계획 생성됨
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PlanVersionDetail'
                  - type: object
                    properties:
                      replanEventId: { type: integer }
        '409':
          $ref: '#/components/responses/Problem409'
        '422':
          description: 재계획해도 목표 달성 불가 (code=PLAN_INFEASIBLE)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /replan-events/{replanEventId}/decision:
    parameters:
      - name: replanEventId
        in: path
        required: true
        schema: { type: integer }
    post:
      operationId: decideReplanEvent
      tags: [replan]
      summary: 재계획 수락 · 거절
      description: |
        - `ACCEPT_NEW_PLAN` — 제안된 버전을 적용하려면 이후
          `POST /plan-versions/{id}/select-option`으로 옵션을 골라야 한다.
        - `KEEP_CURRENT_PLAN` — 제안 버전은 `REJECTED`가 되고 기존 ACTIVE가 유지된다.
          해당 월의 남은 기간 동안 소비 기반(shock · drift) 재계획 알림이 억제된다
          (`spending_replan_suppressed_until`). 소득 · 고정비 · 예정지출 · 목표
          변경으로 인한 트리거는 이 억제와 무관하게 즉시 발생한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [ACCEPT_NEW_PLAN, KEEP_CURRENT_PLAN]
      responses:
        '200':
          description: 반영됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReplanEvent' }
        '409':
          description: 이미 결정된 이벤트 (code=DECISION_ALREADY_MADE)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /replan-events/{replanEventId}/retry:
    parameters:
      - name: replanEventId
        in: path
        required: true
        schema: { type: integer }
    post:
      operationId: retryReplanEvent
      tags: [replan]
      summary: 계산 실패 재계획 이벤트 동기 재시도
      description: |
        미결정이고 proposed plan이 없는 본인 event만 FastAPI 계산을 동기로 다시 호출한다.
        Redis queue는 사용하지 않는다.
      responses:
        '200':
          description: proposal 생성 및 event 연결 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanVersionDetail' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '503':
          description: 계산 서비스 일시 장애. event는 그대로 유지됨
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ─────────────────────────────────────────── dashboard
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: 화면 진입용 통합 조회
      description: |
        웹 진입 시 한 번에 필요한 것을 모아 반환한다.
        `pendingProposal`이 있으면 "새 계획이 제안됐습니다" 배너를 띄운다.
        `monthProgress`는 이번 달 예산 소진 상황이다.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    GoalId:
      name: goalId
      in: path
      required: true
      schema: { type: integer }
    PlanVersionId:
      name: planVersionId
      in: path
      required: true
      schema: { type: integer }

  responses:
    Problem400:
      description: 요청 값 오류
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Problem401:
      description: 인증 실패
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Problem403:
      description: 접근 권한 없음
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Problem404:
      description: 없거나 접근 권한 없음
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Problem409:
      description: 상태 충돌
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:

    Problem:
      type: object
      description: RFC 7807
      required: [type, title, status, detail, code, requestId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        requestId: { type: string }
        code:
          type: string
          description: |
            클라이언트 분기용 코드.
            ACTIVE_GOAL_EXISTS · PROPOSED_PLAN_EXISTS · PLAN_INFEASIBLE ·
            PLAN_NOT_SELECTABLE · OPTION_ALREADY_SELECTED · DECISION_ALREADY_MADE ·
            ONBOARDING_INCOMPLETE · VALIDATION_FAILED
        errors:
          type: array
          description: 필드 단위 검증 오류
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    AuthTokens:
      type: object
      required: [accessToken, expiresIn, isNewUser]
      properties:
        accessToken: { type: string }
        expiresIn:
          type: integer
          description: accessToken 만료까지 남은 초
        isNewUser:
          type: boolean
          description: true면 온보딩 화면으로

    Me:
      type: object
      properties:
        userId: { type: integer }
        email: { type: string }
        displayName: { type: string, nullable: true }
        profileImageUrl: { type: string, nullable: true }
        onboardingComplete: { type: boolean }
        missingSteps:
          type: array
          items:
            type: string
            enum: [PROFILE, FINANCIAL_PROFILE, GOAL]
        activeGoalId: { type: integer, nullable: true }

    DemoTester:
      type: object
      required:
        - testerId
        - displayName
        - description
        - ageGroup
        - monthlyIncome
        - monthlyFixedCost
        - goalName
        - goalTargetAmount
        - goalMonths
      properties:
        testerId: { type: string }
        displayName: { type: string }
        description: { type: string }
        ageGroup: { type: string, enum: [YOUTH, MIDDLE_AGED, SENIOR] }
        monthlyIncome: { type: integer, format: int64, minimum: 0 }
        monthlyFixedCost: { type: integer, format: int64, minimum: 0 }
        goalName: { type: string }
        goalTargetAmount: { type: integer, format: int64, minimum: 1 }
        goalMonths: { type: integer, minimum: 1 }

    DemoSeedRequest:
      type: object
      required: [testerId]
      properties:
        testerId: { type: string }

    DemoSeedResponse:
      type: object
      required: [testerId, scenarioVersion, seededAt]
      properties:
        testerId: { type: string }
        scenarioVersion: { type: integer, minimum: 1 }
        seededAt: { type: string, format: date-time }

    UserProfile:
      type: object
      properties:
        birthDate: { type: string, format: date, nullable: true }
        regionCode:
          type: string
          nullable: true
          pattern: '^[0-9]{5}$'
          description: 행정표준코드 시군구 5자리. 시도는 앞 2자리
        updatedAt: { type: string, format: date-time }

    UserProfileInput:
      type: object
      properties:
        birthDate: { type: string, format: date }
        regionCode: { type: string, pattern: '^[0-9]{5}$' }

    FinancialProfile:
      type: object
      properties:
        monthlyIncome: { type: integer, format: int64 }
        monthlyFixedCost: { type: integer, format: int64 }
        updatedAt: { type: string, format: date-time }

    FinancialProfileInput:
      type: object
      required: [monthlyIncome, monthlyFixedCost]
      properties:
        monthlyIncome: { type: integer, format: int64, minimum: 0 }
        monthlyFixedCost: { type: integer, format: int64, minimum: 0 }

    Goal:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        targetAmount: { type: integer, format: int64 }
        currentSavedAmount: { type: integer, format: int64 }
        targetDate: { type: string, format: date }
        status: { type: string, enum: [ACTIVE, ACHIEVED, CANCELLED] }
        remainingMonths:
          type: integer
          description: 오늘(KST) 기준 목표일까지 남은 개월 수
        spendingReplanSuppressedUntil:
          type: string
          format: date
          nullable: true
        createdAt: { type: string, format: date-time }

    GoalInput:
      type: object
      required: [name, targetAmount, targetDate]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        targetAmount: { type: integer, format: int64, minimum: 1 }
        currentSavedAmount: { type: integer, format: int64, minimum: 0, default: 0 }
        targetDate: { type: string, format: date }

    GoalPatch:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        targetAmount: { type: integer, format: int64, minimum: 1 }
        currentSavedAmount: { type: integer, format: int64, minimum: 0 }
        targetDate: { type: string, format: date }
        status: { type: string, enum: [ACTIVE, ACHIEVED, CANCELLED] }

    ScheduledExpense:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        amount: { type: integer, format: int64 }
        scheduledDate: { type: string, format: date }
        status: { type: string, enum: [PLANNED, COMPLETED, CANCELLED] }
        matchedTransactionCount:
          type: integer
          description: 이 예정지출에 매칭된 실제 거래 건수
        matchedAmount:
          type: integer
          format: int64
          description: 매칭된 거래 합계. 예상액과 다를 수 있다

    ScheduledExpenseInput:
      type: object
      required: [name, amount, scheduledDate]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        amount: { type: integer, format: int64, minimum: 1 }
        scheduledDate: { type: string, format: date }

    ScheduledExpensePatch:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        amount: { type: integer, format: int64, minimum: 1 }
        scheduledDate: { type: string, format: date }
        status: { type: string, enum: [PLANNED, COMPLETED, CANCELLED] }

    Transaction:
      type: object
      properties:
        id: { type: integer, format: int64 }
        transactionAt: { type: string, format: date-time }
        amount:
          type: integer
          format: int64
          description: 항상 양수. 부호는 transactionType이 담당
        transactionType: { type: string, enum: [PAYMENT, REFUND] }
        category: { type: string }
        merchantName: { type: string, nullable: true }
        mcc: { type: integer, nullable: true }
        scheduledExpenseId: { type: integer, nullable: true }
        sourceId: { type: string }
        externalTransactionId: { type: string, nullable: true }
        refundStatus:
          type: string
          enum: [NOT_APPLICABLE, UNMATCHED, PENDING, PARTIALLY_LINKED, LINKED]
        resolvedRefundAmount: { type: integer, format: int64 }
        pendingRefundAmount: { type: integer, format: int64 }
        unmatchedRefundAmount: { type: integer, format: int64 }
        refundAllocations:
          type: array
          items: { $ref: '#/components/schemas/RefundAllocation' }

    TransactionInput:
      type: object
      required: [transactionAt, amount, transactionType, category, sourceId, externalTransactionId]
      properties:
        transactionAt: { type: string, format: date-time }
        amount: { type: integer, format: int64, minimum: 1, maximum: 1000000000000000 }
        transactionType: { type: string, enum: [PAYMENT, REFUND] }
        category: { type: string, minLength: 1 }
        merchantName: { type: string }
        mcc: { type: integer }
        scheduledExpenseId:
          type: integer
          description: 예정지출과 매칭되는 거래면 지정. 소유자가 다르면 400
        sourceId:
          type: string
          minLength: 1
          maxLength: 50
          description: 외부 거래 공급원 식별자. 수동 입력은 MANUAL
        externalTransactionId:
          type: string
          minLength: 1
          maxLength: 100
          description: |
            중복 적재 방지용. 외부 데이터의 원래 거래 ID.
            수동 입력 거래에도 UUID를 발급해 반드시 채울 것
        refundAllocations:
          type: array
          maxItems: 100
          description: REFUND에서만 허용. 합계는 환불액 이하여야 한다
          items: { $ref: '#/components/schemas/RefundAllocationInput' }

    RefundAllocationInput:
      type: object
      required: [paymentSourceId, paymentExternalTransactionId, amount]
      properties:
        paymentSourceId: { type: string, minLength: 1, maxLength: 50 }
        paymentExternalTransactionId: { type: string, minLength: 1, maxLength: 100 }
        amount: { type: integer, format: int64, minimum: 1, maximum: 1000000000000000 }

    RefundAllocation:
      type: object
      required: [id, paymentSourceId, paymentExternalTransactionId, amount, status]
      properties:
        id: { type: integer, format: int64 }
        paymentTransactionId: { type: integer, format: int64, nullable: true }
        paymentSourceId: { type: string }
        paymentExternalTransactionId: { type: string }
        amount: { type: integer, format: int64 }
        status: { type: string, enum: [PENDING, RESOLVED] }

    TransactionPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }
        nextCursor:
          type: string
          nullable: true
          description: null이면 마지막 페이지

    MonthlySpending:
      type: object
      properties:
        yearMonth:
          type: string
          format: date
          description: 그 달 1일 (KST 기준)
        totalVariableSpending:
          type: integer
          format: int64
          description: 호환 필드. adjustedConsumption과 같은 값
        grossPaymentSpending:
          type: integer
          format: int64
          description: 해당 월 PAYMENT 총액
        linkedRefundAmount:
          type: integer
          format: int64
          description: 해당 월 PAYMENT에 연결된 환불 배분액
        unmatchedRefundInflow:
          type: integer
          format: int64
          description: 해당 월 REFUND 중 미연결·pending 금액
        adjustedConsumption:
          type: integer
          format: int64
          description: grossPaymentSpending - linkedRefundAmount
        netCashFlow:
          type: integer
          format: int64
          description: 거래 기준 순현금흐름. 양수는 유입, 음수는 유출
        bootstrapEligibleSpending:
          type: integer
          format: int64
          minimum: 0
          description: MC 입력. 유효한 예정지출을 제외한 연결 환불 조정 소비

    PlanVersionSummary:
      type: object
      properties:
        id: { type: integer }
        versionNo: { type: integer }
        generationType:
          type: string
          enum: [INITIAL, MONTHLY_REGULAR, TRIGGERED_REPLAN, USER_REQUESTED]
        status:
          type: string
          enum: [PROPOSED, ACTIVE, SUPERSEDED, REJECTED, INFEASIBLE, STALE]
        asOfDate: { type: string, format: date }
        infeasibleReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        activatedAt: { type: string, format: date-time, nullable: true }

    PlanVersionDetail:
      allOf:
        - $ref: '#/components/schemas/PlanVersionSummary'
        - type: object
          properties:
            snapshot: { $ref: '#/components/schemas/PlanSnapshot' }
            options:
              type: array
              items: { $ref: '#/components/schemas/PlanOption' }
            explanation: { $ref: '#/components/schemas/Explanation' }
            simulation: { $ref: '#/components/schemas/SimulationInfo' }

    PlanSnapshot:
      type: object
      description: |
        계획 생성 당시의 값. 현재 값이 바뀌어도 과거 계획이 왜 그렇게
        계산됐는지 설명하기 위해 보존한다.
      properties:
        monthlyIncome: { type: integer, format: int64 }
        monthlyFixedCost: { type: integer, format: int64 }
        targetAmount: { type: integer, format: int64 }
        currentSaved: { type: integer, format: int64 }
        targetDate: { type: string, format: date }
        availableVariableBudget:
          type: integer
          format: int64
          description: A. 목표 기간 동안 유동지출에 쓸 수 있는 총액
        currentAvgVariableSpending: { type: integer, format: int64 }
        remainingMonths: { type: integer }

    PlanOption:
      type: object
      properties:
        id: { type: integer }
        optionType: { type: string, enum: [PRESET, CUSTOM] }
        nominalLevel:
          type: number
          nullable: true
          description: PRESET의 0.70 / 0.80 / 0.90. CUSTOM은 null
        recommendedMonthlySpending:
          type: integer
          format: int64
          description: 추천 월 유동지출 한도. 화면의 핵심 숫자
        requiredReductionRate:
          type: number
          description: 현재 평균 대비 필요 감축률. 소득 증가 시 음수 가능
        simulationCoverage:
          type: number
          description: |
            시뮬레이션 충족률 (0~1). **목표 달성 확률이 아니다.**
            UI에는 "시뮬레이션 충족률" 또는 "계획 안정성 수준"으로 표기할 것.
            "달성 확률 90%" 같은 확정적 표현은 사용 금지
        historicalFeasibilityRatio:
          type: number
          description: 최근 24개월 중 이 수준 이하로 소비한 달의 비율
        aggressiveWarning:
          type: boolean
          description: |
            true면 "이 계획은 최근 소비패턴보다 상당히 낮은 수준입니다" 경고와
            함께 소비내역 확인 흐름을 제안한다. 차단이 아니라 재확인 유도
        targetCoverageMet: { type: boolean }
        selectedAt: { type: string, format: date-time, nullable: true }
        percentileBands:
          type: array
          description: fan chart 재현용 월별 분위수
          items: { $ref: '#/components/schemas/PercentileBand' }

    PercentileBand:
      type: object
      properties:
        monthIndex: { type: integer, description: 계획 시작 후 N개월차 (1부터) }
        metricType: { type: string, example: CUMULATIVE_SAVINGS }
        p10: { type: integer, format: int64 }
        p25: { type: integer, format: int64 }
        p50: { type: integer, format: int64 }
        p75: { type: integer, format: int64 }
        p90: { type: integer, format: int64 }

    Explanation:
      type: object
      properties:
        status:
          type: string
          enum: [PENDING, PROCESSING, READY, FALLBACK, FAILED]
        text: { type: string, nullable: true }
        model: { type: string, nullable: true }
        generatedAt: { type: string, format: date-time, nullable: true }
        retryCount:
          type: integer
          nullable: true
          description: 가드레일 재시도 횟수 (운영 관찰용)
        promptVersion: { type: string, nullable: true }
        failedNumbers:
          type: array
          items: { type: string }

    SimulationInfo:
      type: object
      nullable: true
      description: INFEASIBLE 버전은 null
      properties:
        method: { type: string, example: IID_BOOTSTRAP }
        nPaths: { type: integer, example: 10000 }
        engineVersion: { type: string }
        createdAt: { type: string, format: date-time }

    ReplanEvent:
      type: object
      properties:
        id: { type: integer }
        triggerType:
          type: string
          enum:
            - MONTHLY_REGULAR
            - LARGE_UNEXPECTED_TRANSACTION
            - CUMULATIVE_OVERSPENDING
            - INCOME_CHANGED
            - FIXED_COST_CHANGED
            - SCHEDULED_EXPENSE_CHANGED
            - GOAL_AMOUNT_CHANGED
            - GOAL_DATE_CHANGED
            - USER_REQUESTED
        triggerDetails:
          type: object
          additionalProperties: true
          description: |
            트리거별 근거 수치.
            LARGE_UNEXPECTED_TRANSACTION: amount, p95, threshold, transactionId
            CUMULATIVE_OVERSPENDING: checkpointDay, actualCumulative, plannedCumulative, ratio
            MONTHLY_REGULAR: scheduleMonth, asOfDate
            *_CHANGED: before, after
        sourcePlanVersion: { $ref: '#/components/schemas/PlanVersionSummary' }
        proposedPlanVersion:
          type: object
          allOf:
            - $ref: '#/components/schemas/PlanVersionSummary'
          nullable: true
        userDecision:
          type: string
          nullable: true
          enum: [ACCEPT_NEW_PLAN, KEEP_CURRENT_PLAN]
        createdAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time, nullable: true }

    Dashboard:
      type: object
      properties:
        goal:
          type: object
          allOf: [{ $ref: '#/components/schemas/Goal' }]
          nullable: true
        activePlan:
          type: object
          allOf: [{ $ref: '#/components/schemas/PlanVersionDetail' }]
          nullable: true
        selectedOption:
          type: object
          allOf: [{ $ref: '#/components/schemas/PlanOption' }]
          nullable: true
        pendingProposal:
          type: object
          nullable: true
          description: 사용자가 아직 결정하지 않은 PROPOSED 계획
          properties:
            planVersionId: { type: integer }
            replanEventId: { type: integer, nullable: true }
            triggerType: { type: string, nullable: true }
            createdAt: { type: string, format: date-time }
        monthProgress:
          type: object
          nullable: true
          description: 이번 달(KST) 예산 소진 상황
          properties:
            yearMonth: { type: string, format: date }
            plannedMonthlySpending: { type: integer, format: int64 }
            actualToDate: { type: integer, format: int64 }
            paceRatio:
              type: number
              description: 경과일 기준 계획 누적액 대비 실제 누적액 비율
            daysElapsed: { type: integer }
