services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dacon}
      POSTGRES_USER: ${POSTGRES_USER:-dacon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 설정하세요}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/02_integrity.sql:/docker-entrypoint-initdb.d/02_integrity.sql:ro
      - ./sql/05_integrated_service.sql:/docker-entrypoint-initdb.d/05_integrated_service.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB >/dev/null && psql -U $$POSTGRES_USER -d $$POSTGRES_DB -tAc \"SELECT to_regclass('public.users') IS NOT NULL\" | grep -q t"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD를 설정하세요}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD를 설정하세요}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  ollama:
    image: ollama/ollama:latest
    profiles: [llm]
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend, egress]

  ollama-model:
    image: ollama/ollama:latest
    profiles: [llm]
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${OLLAMA_CHAT_MODEL:-qwen3:0.6b-q4_K_M}"]
    volumes:
      - ollama_data:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    networks: [backend]

  core-api:
    build:
      context: .
      dockerfile: Dockerfile.core
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-dacon}
      DB_USER: ${POSTGRES_USER:-dacon}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 설정하세요}
      ANALYSIS_BASE_URL: http://analysis-api:8000
      ANALYSIS_INTERNAL_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN을 설정하세요}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET을 설정하세요}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID를 설정하세요}
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD를 설정하세요}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      EXPLANATION_AI_ENABLED: ${EXPLANATION_AI_ENABLED:-false}
      EXPLANATION_TIMEOUT: ${EXPLANATION_TIMEOUT:-15s}
      CHAT_AI_ENABLED: ${CHAT_AI_ENABLED:-false}
      CHAT_TIMEOUT: ${CHAT_TIMEOUT:-3s}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:0.6b-q4_K_M}
      FINLIFE_API_KEY: ${FINLIFE_API_KEY:-}
      E2E_TOKEN: ${E2E_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      analysis-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [backend, egress]

  analysis-api:
    build: ./analysis-api
    environment:
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN을 설정하세요}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import os,urllib.request; r=urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/internal/health', headers={'X-Internal-Token':os.environ['INTERNAL_API_TOKEN']})); assert r.status == 200"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "${PUBLIC_BIND_IP:-127.0.0.1}:${HTTP_PORT:-80}:80"
      - "${PUBLIC_BIND_IP:-127.0.0.1}:${HTTPS_PORT:-443}:443"
      - "${PUBLIC_BIND_IP:-127.0.0.1}:${HTTPS_PORT:-443}:443/udp"
    environment:
      API_ADDRESS: ${API_ADDRESS:-https://localhost}
      HTTP_ADDRESS: ${HTTP_ADDRESS:-:80}
      HTTP_PORT: ${HTTP_PORT:-80}
      HTTPS_PORT: ${HTTPS_PORT:-443}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--spider", "https://localhost/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend, edge]

volumes:
  pg_data:
  redis_data:
  ollama_data:
  caddy_data:
  caddy_config:

networks:
  backend:
    internal: true
  edge:
  egress:
