services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dacon}
      POSTGRES_USER: ${POSTGRES_USER:-dacon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dacon}
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD를 설정하세요}"]
    volumes:
      - redis_data:/data

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama

  core-api:
    build: ./core-api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-dacon}
      DB_USER: ${POSTGRES_USER:-dacon}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dacon}
      ANALYSIS_API_URL: http://analysis-api:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN을 설정하세요}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD를 설정하세요}
    depends_on:
      - postgres
      - redis
      - analysis-api

  analysis-api:
    build: ./analysis-api
    environment:
      OLLAMA_URL: http://ollama:11434
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN을 설정하세요}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      - ollama

  caddy:
    image: caddy:2.8.4-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_ADDRESS: ${API_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - core-api

volumes:
  pg_data:
  redis_data:
  ollama_data:
  caddy_data:
  caddy_config:
