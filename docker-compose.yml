services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dacon}
      POSTGRES_USER: ${POSTGRES_USER:-dacon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dacon}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  core-api:
    build: ./core-api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-dacon}
      DB_USER: ${POSTGRES_USER:-dacon}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dacon}
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  analysis-api:
    build: ./analysis-api
    environment:
      OLLAMA_URL: http://ollama:11434
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-dacon}:${POSTGRES_PASSWORD:-dacon}@postgres:5432/${POSTGRES_DB:-dacon}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - ollama

  web:
    build: ./web
    ports:
      - "3000:80"
    depends_on:
      - core-api

volumes:
  pg_data:
  ollama_data:
