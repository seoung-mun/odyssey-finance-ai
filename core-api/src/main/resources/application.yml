server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dacon}
    username: ${DB_USER:dacon}
    password: ${DB_PASSWORD:dacon}
  jpa:
    # 스키마 미확정(기획서 8-1) 상태라 update로 둠 — 스키마 확정되면 Flyway로 교체
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
