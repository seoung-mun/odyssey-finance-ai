server:
  port: 8080

spring:
  ai:
    model:
      chat: none
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dacon}
    username: ${DB_USER:dacon}
    password: ${DB_PASSWORD:dacon}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 3
    locations: ${FLYWAY_LOCATIONS:filesystem:../sql/migrations}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${REDIS_TIMEOUT:1s}

app:
  cors-allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:}
  jwt-secret: ${JWT_SECRET}
  google-client-id: ${GOOGLE_CLIENT_ID:}
  analysis-base-url: ${ANALYSIS_BASE_URL:http://localhost:8000}
  analysis-token: ${ANALYSIS_INTERNAL_TOKEN:}
  analysis-timeout: ${ANALYSIS_TIMEOUT:3s}
  explanation-ai-enabled: ${EXPLANATION_AI_ENABLED:false}
  explanation-timeout: ${EXPLANATION_TIMEOUT:15s}
  chat-ai-enabled: ${CHAT_AI_ENABLED:false}
  chat-timeout: ${CHAT_TIMEOUT:3s}
  explanation-stream: ${EXPLANATION_STREAM:explanation-jobs}
  finlife-api-key: ${FINLIFE_API_KEY:}
  finlife-base-url: ${FINLIFE_BASE_URL:https://finlife.fss.or.kr/finlifeapi}
  # 실측 기준 savingProductsSearch 응답이 16초대라 5s는 항상 timeout 난다 (2026-09-06 확인).
  finlife-timeout: ${FINLIFE_TIMEOUT:45s}
  finlife-max-attempts: ${FINLIFE_MAX_ATTEMPTS:3}
  finlife-refresh-cron: ${FINLIFE_REFRESH_CRON:0 15 4 * * *}
  e2e-token: ${E2E_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health
