server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dacon}
    username: ${DB_USER:dacon}
    password: ${DB_PASSWORD:dacon}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${REDIS_TIMEOUT:1s}

app:
  jwt-secret: ${JWT_SECRET}
  google-client-id: ${GOOGLE_CLIENT_ID:}
  analysis-base-url: ${ANALYSIS_BASE_URL:http://localhost:8000}
  analysis-token: ${ANALYSIS_INTERNAL_TOKEN:}
  analysis-timeout: ${ANALYSIS_TIMEOUT:2s}
  explanation-stream: ${EXPLANATION_STREAM:explanation-jobs}

management:
  endpoints:
    web:
      exposure:
        include: health
