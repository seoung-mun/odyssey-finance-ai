, \\u0026#9313;혼인(이혼), \\u0026#9314;미혼부\\u0026middot;모, \\u0026#9315; 30세 미만 미혼 청년의 소득이 중위소득 50% 이상으로 생계를 달리한다고 시\\u0026middot;군\\u0026middot;구청장이 인정하는 경우 등은 원가구 소득 미고려\\u003c/li\\u003e\\n\\u003cul class\\u003d\\\"txtBlit4\\\"\\u003e\\n\\u003cli\\u003e(청년가구) 청년 + 배우자 + 직계비속 + 동일 주소지에 거주하는 그 외「민법」상 가족\\u003c/li\\u003e\\n\\u003cli\\u003e(원가구) 청년독립가구 + 1촌이내 직계혈족(부\\u0026middot;모)\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cli\\u003e아래에 해당하는 경우 지원 대상에서 제외합니다. \\n\\u003cul class\\u003d\\\"txtBlit4\\\"\\u003e\\n\\u003cli\\u003e주택 소유자(분양권, 입주권 포함)\\u003c/li\\u003e\\n\\u003cli\\u003e직계존속\\u0026middot;형제\\u0026middot;자매 등 2촌 이내 혈족(배우자의 2촌 이내 혈족 포함) 주택 임차\\u003c/li\\u003e\\n\\u003cli\\u003e공공주택특별법에 따른 공공임대주택(공무원임대주택 포함) 거주\\u003c/li\\u003e\\n\\u003cli\\u003e1실(방)에 다수가 거주하는 방식의 전대차인 경우(단, 1실에 다수가 거주하는 경우라도 임대인과 별도 임대차계약 체결 시 지원 가능)\\u003c/li\\u003e\\n\\u003cli\\u003e국토부 또는 지자체 에서 시행하는 청년월세 지원 수혜 중인 자(수혜종료 후 신청 가능) 등\\u003c/li\\u003e\\n\\u003cli\\u003e과거 \\u0027청년월세 한시 특별지원\\u0027사업에 선정되어 이미 24개월을 수혜받은 자 등\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003c/ul\\u003e\\u003c/div\\u003e\\u003c/div\\u003e\",\"aplyMtdDc\":\"\\u003cdiv class\\u003d\\\"bokjiServiceView\\\"\\u003e\\n\\u003cdiv class\\u003d\\\"bokjiConts\\\"\\u003e\\n\\u003cul class\\u003d\\\"bokjiContsIn\\\"\\u003e\\n\\u003cul class\\u003d\\\"bokjiBlit01\\\"\\u003e\\n\\u003cli\\u003e\\u003cspan style\\u003d\\\"font-weight: bold;\\\"\\u003e2026년 신규수혜자 신청접수 기간: 3.30(월) 09:00 ~ 5.29(금) 16:00까지\\u003c/span\\u003e\\u003cbr\\u003e\\n\\u003cspan style\\u003d\\\"font-weight: bold;\\\"\\u003e- (선정자공고) 9.14(월) - (선정인원) 전국 6만명(지원자가 많을 경우 소득, 재산 등이 낮은 인원을 선정)\\u003c/span\\u003e\\u003c/li\\u003e\\u003cbr\\u003e\\n\\n\\u003cli\\u003e주소지 관할 주민센터에 청년 본인이 방문하거나 복지로(\\u003ca href\\u003d\\\"http://bokjiro.go.kr\\\" tabindex\\u003d\\\"0\\\" target\\u003d\\\"_blank\\\" title\\u003d\\\"새창으로 열림\\\"\\u003ebokjiro.go.kr\\u003c/a\\u003e)에서 온라인으로 신청이 가능합니다.\\u003c/li\\u003e\\n\\u003cul class\\u003d\\\"txtBlit4\\\"\\u003e\\n\\u003cli\\u003e방문 신청 시 청년 본인이 신청하는 것이 원칙이나, 불가피한 경우\\u0026nbsp;대리인(\\u0026#9312;법정대리인 \\u0026#9313;주민등록상 동일 세대원(동거인 제외)\\u0026nbsp;\\u0026#9314;동일 세대원이 아닌 배우자 및 직계존\\u0026middot;비속)도\\u0026nbsp;신청이 가능하며, 해당 경우에도 월세는 청년 본인 계좌로 지급됩니다.\\u003cbr\\u003e\\n \u203b 대리인 신청시 위임장, 대리인 신분증(주민등록증, 운전면허증, 여권 등)을 지참 후 방문\\u003cbr\\u003e \u203b 다만, 압류방지통장으로 입금은 불가하며, 본인 명의의 계좌 개설이 곤란한 경우 등은 기초생활보장제도 계좌관리 원칙에 따름\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cli\\u003e복지로 온라인신청 경로는 다음과 같습니다.\\u003c/li\\u003e\\n\\u003cul class\\u003d\\\"txtBlit4\\\"\\u003e\\n\\u003cli\\u003e복지로 로그인 \\u0026gt; 서비스 신청 \\u0026gt; 복지서비스 신청 \\u0026gt; 복지급여 신청 \\u0026gt; 기타 \\u0026gt; 청년월세지원\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003c/ul\\u003e\\n\\u003c/ul\\u003e\\u003c/div\\u003e\\u003c/div\\u003e\",\"wlfareSprtTrgtSlcrCn\":\"\\u003cdiv class\\u003d\\\"bokjiServiceView\\\"\\u003e\\n\\u003cdiv class\\u003d\\\"bokjiConts\\\"\\u003e\\n\\u003cul class\\u003d\\\"bokjiContsIn\\\"\\u003e\\n\\u003cul class\\u003d\\\"bokjiBlit01\\\"\\u003e\\n\\u003cli\\u003e청년가구 소득\\u0026middot;재산평가액 산정 기준은 다음과 같습니다. \\n\\u003cul class\\u003d\\\"txtBlit4\\\"\\u003e\\n\\u003cli\\u003e\\u0026#9312; 소득평가액이\\u0026nbsp;「국민기초생활 보장법」 제2조제11호에 따른 기준 중위소득의 60% 이하\\u003cbr\\u003e - 소득평가액 \\u003d ㉮근로소득 + ㉯사업소득 + ㉰재산소득 + ㉱공적이전소득 - ㉲근로\\u0026middot;사업소득공제\\u0026nbsp;\\u003c/li\\u003e\\n\\u003cli\\u003e\\u0026#9313; 일반재산, 자동차 등의 재산에 관하여 총재산가액이 1.22억원 이하\\u003cbr\\u003e - 총재산가액\\u003d ㉳일반재산가액 + ㉴자동차가액 - ㉵부채(임차보증금 마련 용도의 부채만 인정)\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\u003c/li\\u003e\\n\\u003cli\\u003e원가구 소득\\u0026middot;재산평가액 산정 기준 다음과 같습니다. \\n\\u003cul class\\u003d\\\"txtBlit4\\\"\\u003e\\n\\u003cli\\u003e\\u0026#9312; 소득평가액이 「국민기초생활 보장법」 제2조제11호에 따른 기준 중위소득의 100% 이하\\u003cbr\\u003e - 소득평가액 \\u003d ㉮근로소득 + ㉯사업소득 + ㉰재산소득 + ㉱공적이전소득 - ㉲근로\\u0026middot;사업소득공제\\u003c/li\\u003e\\n\\u003cli\\u003e\\u0026#9313; 일반재산, 자동차 등의 재산에 관하여 총재산가액이 4.7억원 이하\\u003cbr\\u003e\\n - 총재산가액\\u003d ㉳일반재산가액 + ㉴자동차가액 - ㉵부채(주택구입\\u0026middot;임차보증금 마련 용도의 부채만 인정)\\u003cbr\\u003e\\n \\u003cbr\\u003e\\n * 참고\\u003cbr\\u003e\\n \\u0026nbsp;㉮ (근로소득) 상시근로자소득 \\u003cbr\\u003e\\n \\u0026nbsp;㉯ (사업소득) 기타사업소득 \\u003cbr\\u003e\\n \\u0026nbsp;㉰ (재산소득) 임대소득, 이자소득 \\u003cbr\\u003e\\n \\u0026nbsp;㉱ (공적이전소득) 국민연금급여, 사학퇴직연금급여, 공무원퇴직연금급여, 군인퇴직연금급여, 별정우체국연금, 산재보험급여(휴업급여, 장해급여, 유족급여, 상병보상금), 실업급여 \\u003cbr\\u003e\\n \\u0026nbsp;㉲ (근로소득공제) 근로\\u0026middot;사업소득30% \\u003cbr\\u003e\\n \\u0026nbsp;㉳ (일반재산) 건축물(건물, 시설물, 기타), 주택, 토지(밭, 논, 대지, 임야, 기타), 임차보증금(전월세보증금, 상가보증금), 선박, 항공기, 회원권(골프, 콘도미니엄, 승마, 종합체육시설이용, 요트) \\u003cbr\\u003e\\n \\u0026nbsp;㉴ (자동차) 자동차가액 \\u003cbr\\u003e\\n \\u0026nbsp;㉵ (부채) 다음에 따른 증빙서류를 제출한 경우에만 인정\\u003cbr\\u003e\\n \\u0026nbsp;- 대출금 : 금융기관 대출금, 금융기관이외기관 대출금\\u003cbr\\u003e\\n \\u0026nbsp;- 공공기관 대출금 : 농지연금 등\\u003cbr\\u003e\\n \\u0026nbsp;\u203b 주택구입, 임차보증금 마련 용도의 부채만 인정\\u003cbr\\u003e \\u0026nbsp;\u203b 취득한 주택의 등기사항 증명서 상 소유권 이전등기 접수일로부터 3개월 이내 대출한 자금의 경우 주택구입자금으로 인정\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003c/ul\\u003e\\u003c/div\\u003e\\u003c/div\\u003e\",\"wlfareSprtBnftCn\":\"\\u003cdiv class\\u003d\\\"bokjiServiceView\\\"\\u003e\\n\\u003cdiv class\\u003d\\\"bokjiConts\\\"\\u003e\\n\\u003cul class\\u003d\\\"bokjiContsIn\\\"\\u003e\\n\\u003cul class\\u003d\\\"bokjiBlit01\\\"\\u003e\\n\\u003cli\\u003e월세로 거주하는 청년을 대상으로 실제 납부하는 임대료를 \\u003cspan style\\u003d\\\"font-weight: bold;\\\"\\u003e최대 480만원(월 최대 20만원)까지 최대 24개월(회) 동안 매월 분할\\u003c/span\\u003e하여 지원합니다.\\u003c/li\\u003e\\n\\u003cul class\\u003d\\\"txtBlit4\\\"\\u003e\\n\\u003cli\\u003e실제 월세 범위 내에서 지원하며,\\u0026nbsp;임차보증금, 관리비 등은 제외\\u0026nbsp;후 지원합니다.\\u003c/li\\u003e\\n\\u003cli\\u003e주거급여 수급자의 경우 주거급여액 중 월차임분(청년 주거급여 분리지급액 포함)을 차감한 금액만 지원합니다.\\u003c/li\\u003e\\n\\u003cli\\u003e방학기간 등으로 수급기간이 연속적이지 않더라도 지급기간 내\\u003cspan style\\u003d\\\"font-weight: bold;\\\"\\u003e 24개월(회)분\\u003c/span\\u003e을 지원합니다.\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cli\\u003e지급기간 : ~ 2028년 12월\\u003cbr\\u003e\\n \\n\\u003cul class\\u003d\\\"txtBlit4\\\"\\u003e\\n\\u003cli\\u003e2026년 신규 수혜자는 2028년 12월까지 지원\\u003c/li\\u003e\\n\\u003cli\\u003e2026년에 선정된 이후 지급 중지 등으로 인해 \\u002728년까지 24개월(회)\\u0026nbsp;지원을 다 못 받았다면, \\u002729년 이후 정기 신청기간에 재신청(소득, 재산 재심사)하여 선정될 때 지원을 재개하고 잔여횟수만 지원\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003c/ul\\u003e\\u003c/div\\u003e\\u003c/div\\u003e\",\"tagNm\":null,\"cmmCdNm\":\"WLFARE_INFO_AGGRP_CD:19~39세;SRSP_TRGT_CD:가구;INCPR_SLCR_CD:기준중위소득,재산최고 기준액;INC_CRTR_ERSW_CD:긴급지원대상자;WLFBZ_APLCNT_TCD:대리인(배우자, 친족, 관계인),본인;APLY_MTD_DCD:방문,인터넷;MNOF_LCGV_BIZ_DCD:부처사업;CYC_CD:월;FLCTN_TRGT_TCD:자격변동,거주지변동,기타;FMLY_CIRC_CD:저소득;INTRS_THEMA_CD:주거;BKJR_LFTM_CYC_CD:청년;SPRT_CIRC_TCD:해당없음;RSDC_CRTR_ERSW_CD:해당없음;OCCP_TYP_CRTR_CD:해당없음;TRPR_CHA_CRTR_QLFC_CD:해당없음;TRPR_CHA_HEALTH_SCD:해당없음;DSPSN_REG_DCD:해당없음;FMLY_CRTR_ERSW_CD:해당없음(전체가구);WLBZSL_TCD:현금지급\",\"wlfareInfoReldBztpCdNm\":\"중앙부처복지사업\"}","dsWlfareInfoDtl":"[{\"wlfareInfoId\":\"WLF00004661\",\"wlfareInfoDtlCd\":\"010\",\"wlfareInfoDtlSn\":1,\"cmsatSn\":null,\"arrgOrd\":1,\"atcflId\":null,\"atcflSn\":null,\"oriFileNm\":null,\"dnldNt\":null,\"fileDc\":null,\"wlfareInfoReldNm\":\"국토교통부\",\"wlfareInfoReldCn\":\"1599-0001\",\"fileFrmNm\":null},{\"wlfareInfoId\":\"WLF00004661\",\"wlfareInfoDtlCd\":\"020\",\"wlfareInfoDtlSn\":1,\"cmsatSn\":null,\"arrgOrd\":1,\"atcflId\":null,\"atcflSn\":null,\"oriFileNm\":null,\"dnldNt\":null,\"fileDc\":null,\"wlfareInfoReldNm\":\"국토교통부\",\"wlfareInfoReldCn\":\"https://www.molit.go.kr/\",\"fileFrmNm\":null},{\"wlfareInfoId\":\"WLF00004661\",\"wlfareInfoDtlCd\":\"020\",\"wlfareInfoDtlSn\":2,\"cmsatSn\":null,\"arrgOrd\":2,\"atcflId\":null,\"atcflSn\":null,\"oriFileNm\":null,\"dnldNt\":null,\"fileDc\":null,\"wlfareInfoReldNm\":\"마이홈포털\",\"wlfareInfoReldCn\":\"https://www.myhome.go.kr/\",\"fileFrmNm\":null},{\"wlfareInfoId\":\"WLF00004661\",\"wlfareInfoDtlCd\":\"030\",\"wlfareInfoDtlSn\":1,\"cmsatSn\":null,\"arrgOrd\":1,\"atcflId\":null,\"atcflSn\":null,\"oriFileNm\":null,\"dnldNt\":null,\"fileDc\":
